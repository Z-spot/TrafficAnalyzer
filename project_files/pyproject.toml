[project]
name = "trafficflow"
version = "0.1.0"
description = "Offline vehicle detection, tracking, movement counts and KPIs for one signalised intersection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Exact pins. Chosen versions and reasons are logged in docs/decisions.md.
dependencies = [
    "ultralytics==8.4.175",
    "supervision==0.30.9",
    "opencv-python==4.14.0.94",  # hold at 4.x, OpenCV 5 is a new major version
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trafficflow"]

[tool.uv]
# Only resolve releases at least two weeks old at the time of pinning.
exclude-newer = "2026-10-11T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
